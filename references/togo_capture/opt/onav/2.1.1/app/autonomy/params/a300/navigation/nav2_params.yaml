onav_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "localization/odom"
    bt_loop_duration: 10
    default_server_timeout: 2000 #20
    wait_for_service_timeout: 10000 #1000
    action_server_result_timeout: 5000.0 #900.0

    navigators:
      - navigate_to_pose
      - navigate_through_poses
      - onav_network_go_to
      - onav_network_go_to_poi
      - onav_network_mission_from_goal
      - onav_network_mission
      - onav_network_dock
      - onav_dock
      - onav_undock

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    onav_network_go_to:
      plugin: "onav_navigation::OnavNetworkGoToNavigator"
    onav_network_mission:
      plugin: "onav_navigation::OnavNetworkMissionNavigator"
    onav_network_mission_from_goal:
      plugin: "onav_navigation::OnavNetworkMissionFromGoalNavigator"
    onav_network_dock:
      plugin: "onav_navigation::OnavNetworkDockNavigator"
    onav_dock:
      plugin: "onav_navigation::OnavDockNavigator"
    onav_undock:
      plugin: "onav_navigation::OnavUndockNavigator"
    onav_network_go_to_poi:
      plugin: "onav_navigation::OnavNetworkGoToPoINavigator"
    plugin_lib_names:
      - onav_initialize_network_costmap_bt_node
      - onav_wait_action_bt_node
      - onav_get_network_path_bt_node
      - onav_get_network_map_bt_node
      - onav_get_network_mission_bt_node
      - onav_is_autonomy_paused_condition_bt_node
      - onav_exe_path_action_bt_node
      - onav_pop_queue_action_bt_node
      - onav_execute_task_bt_node
      - onav_task_executor_control_bt_node
      - onav_get_current_network_edge_action_bt_node
      - onav_get_network_path_to_goal_pose_bt_node
      - onav_get_dock_info_bt_node
      - onav_dock_action_bt_node
      - onav_undock_action_bt_node
      - onav_get_network_poi_bt_node
      - onav_update_global_context_bt_node

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: True
    max_robot_pose_search_dist: 20.0
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["mppi_basic"]
    use_realtime_priority: false
    odom_topic: "localization/odom"
    desired_linear_vel: 1.0
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 45.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.5
      yaw_goal_tolerance: 0.2

    mppi_basic:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.9 #1.5
      forward_sampling_distance: 0.5
      angular_disengage_threshold: 0.3925
      rotate_to_heading_angular_vel: 0.6 #0.35
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      rotate_to_heading_once: true

      max_robot_pose_search_dist: 4.0
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 3.0
      ax_min: -5.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.25
      vy_std: 0.2
      wz_std: 0.2
      vx_max: 2.0
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.9

      iteration_count: 1
      prune_distance: 4.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 15
        time_step: 10
      AckermannConstraints:
        min_turning_r: 0.2
      critics: [
        "ConstraintCritic", "GoalCritic", "CostCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.2 #0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 50.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: false
        cost_power: 1
        repulsion_weight: 5.0
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 10000.0
        collision_margin_distance: 0.2
        near_goal_distance: 0.5
        inflation_radius: 0.55 # (only in Humble)
        cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0 #20.0 #3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 1.0
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 5
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 1.0 
        offset_from_furthest: 4 
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0


local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: True
      enable_stamped_cmd_vel: True
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: map
      robot_base_frame: base_link
      lethal_cost_threshold: 50
      rolling_window: true
      map_topic: map2
      use_maximum: true
      width: 14
      height: 14
      track_unknown_space: false
      resolution: 0.05
      robot_radius: 0.4
      initial_transform_timeout: 9999.0
      initial_transform_tolerance: 9999.0
      footprint: "[ [-0.5, 0.35], [0.5, 0.35], [0.5, -0.35], [-0.5, -0.35] ]"
      transform_tolerance: 5.0
      plugins: ["static_layer", "vdb_layer", "inflation_layer"]
      #filters: ["keepout_filter"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False
        map_topic: /autonomy/context_grid      
      keepout_filter:
        plugin: "onav_navigation::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 25.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.0 #1.5
        inflation_radius: 1.0 #1.5
      vdb_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        voxel_decay: 3.5
        decay_model: 0 # 0 = linear, 1 = exponential, -1 = persistent
        voxel_size: 0.05 # meters
        track_unknown_space: False # default space is unknown
        mark_threshold: 3 # 
        update_footprint_enabled: True
        robot_base_frame: "base_link"
        combination_method: 1 # 1 = max, 0 = override
        origin_z: 0.0 # meters
        publish_voxel_map: False # default off
        transform_tolerance: 0.2 # seconds
        mapping_mode: False
        map_save_duration: 60.0 # default
        observation_sources: robin_mark robin_clear
        robin_mark:
          data_type: PointCloud2
          topic: /points/nonground
          marking: True
          clearing: False
          obstacle_range: 6.0 #3.0 # meters
          min_obstacle_height: 0.0 #0.25 #0.0 #0.2 #0.3 # meters
          max_obstacle_height: 2.0
          expected_update_rate: 0.0 # default 0, used to remove from buffer
          observation_persistence: 0.0 #default 0, use all measurements taken during now-value
          inf_is_valid: False
          filter: "passthrough_relative"
          z_reference_frame: "front_bumper_link"
          voxel_min_points: 0 # Minimum points per voxel for voxel filter
          clear_after_reading: False # clear the buffer after the layer gets readings from it
        robin_clear:
          data_type: PointCloud2
          topic: /points
          marking: false
          clearing: true
          max_z: 70.0
          min_z: 0.1
          # vertical_fov_angle: 0.9 # Robin = 70 degrees (50 above, 20 below) = 1.22 rad
          # horizontal_fov_angle: 1.4 #2.5    # Robin = 120 degrees = 2.1 rad
          decay_acceleration: 1.0     # default 0, 1/s^2. If laser scanner MUST be 0
          model_type: 1                # default 0, model type for frustum. 0=depth camera, 1=3d lidar like VLP16 or similar
          vertical_fov_angle: 1.9 #1.22   # default 0.7, radians. For 3D lidars it's the symmetric FOV about the planar axis.
          vertical_fov_padding: 0.05    # 3D Lidar only. Default 0, in meters
          horizontal_fov_angle: 2.3 #2.1  # 3D lidar scanners like the VLP16 have 360 deg horizontal FOV.

global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.22
      resolution: 0.05
      # track_unknown_space: true
      track_unknown_space: false
      rolling_window: false
      footprint: "[ [-0.5, 0.35], [0.5, 0.35], [0.5, -0.35], [-0.5, -0.35] ]"
      width: 250
      height: 250
      initial_transform_timeout: 9999.0
      initial_transform_tolerance: 9999.0
      plugins: ["obstacle_layer", "static_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: False
        map_topic: /autonomy/context_grid
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.7
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: True
    smoother_plugins: ["ccma_smoother"]
    ccma_smoother:
      plugin: "onav_smoother::CCMASmoother"    
    simple_smoother:
      plugin: "onav_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 5000
      do_refinement: True
      refinement_num: 4
      w_smooth: 0.75
      w_data: 0.05

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 1.0 #0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [2.0, 0.0, 2.5]
    min_velocity: [-1.0, 0.0, -2.5]
    max_accel: [1.4, 0.0, 5.0]
    max_decel: [-3.0, 0.0, -5.0]
    odom_topic: "platform/odom"
    odom_duration: 0.02
    deadband_velocity: [0.0, 0.0, 0.05]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    transform_tolerance: 0.5
    source_timeout: 5.0
    stop_pub_timeout: 2.0
    enable_stamped_cmd_vel: True
    polygons: ["PolygonStop", "VelocityPolygonSlowdown"]
    state_topic: "navigation/collision_state"
    PolygonStop:
      type: "polygon"
      points: "[[1.2, 0.3], [1.2, -0.3], [0.0, -0.3], [0.0, 0.3]]"
      action_type: "stop"
      min_points: 4 
      visualize: True
      polygon_pub_topic: "polygon_stop"
    observation_sources: ["robin_pointcloud"]
    robin_pointcloud:
      type: "pointcloud"
      topic: /points/nonground
      min_height: 0.2
      max_height: 1.0
      sampling_distance: 0.1
      enabled: True
    VelocityPolygonSlowdown:
      type: "velocity_polygon"
      action_type: "slowdown"
      min_points: 6
      visualize: True
      enabled: True
      polygon_pub_topic: "velocity_slowdown_zone_1"
      velocity_polygons: ["2ms", "1ms", "stopped"]
      holonomic: false
      2ms:
        points: "[[4.0, 2.0], [4.0, -2.0], [-1.0, -2.0], [-1.0, 2.0]]"
        linear_min: 1.0
        linear_max: 2.0
        theta_min: -1.0
        theta_max: 1.0
        slowdown_ratio: 0.75
      1ms:
        points: "[[2.0, 1.5], [2.0, -1.5], [-1.0, -1.5], [-1.0, 1.5]]"
        linear_min: 0.1
        linear_max: 1.0
        theta_min: -1.0
        theta_max: 1.0
        slowdown_ratio: 0.5
      stopped:
        points: "[[0.5, 0.4], [0.5, -0.4], [-0.5, -0.4], [-0.5, 0.4]]"
        linear_min: -2.0
        linear_max: 2.0
        theta_min: -2.0
        theta_max: 2.0        
