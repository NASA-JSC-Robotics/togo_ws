server {
        listen 80 default_server;

        server_name _;

        location / {
                proxy_http_version 1.1;
                proxy_cache_bypass $http_upgrade;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'Upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_pass http://onav-web:5000/;
        }

        location /_/video/ {
                proxy_http_version 1.1;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # Header is needed to prevent zipped response so sub_filter can work
                proxy_set_header Accept-Encoding "";

                proxy_pass http://host.docker.internal:8080/;
                proxy_buffering off;

                sub_filter_types *;
                sub_filter_once off;
                sub_filter 'href="/' 'href="';
                sub_filter 'src="/' 'src="';
        }

        location /_/ros {
                proxy_http_version 1.1;
                proxy_cache_bypass $http_upgrade;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'Upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Access-Control-Allow-Origin *;

                proxy_pass http://host.docker.internal:9091/;
        }

        location /_/fgws {
                proxy_http_version 1.1;
                proxy_cache_bypass $http_upgrade;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Access-Control-Allow-Origin *;
                proxy_pass http://host.docker.internal:8780/;
        }

        location /_/map_tiles/ {
                proxy_http_version 1.1;
                sub_filter_types *;
                sub_filter_once off;
                sub_filter 'src="/' 'src="/_/map_tiles/';

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Access-Control-Allow-Origin *;
                proxy_set_header Accept-Encoding "";

                proxy_pass http://host.docker.internal:8085/map_tiles/;
        }

        location /_/logs {
                proxy_http_version 1.1;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Access-Control-Allow-Origin *;

                proxy_pass http://host.docker.internal:5200/_/logs;
        }

        location /_/foxglove {
                if ($request_uri ~ ^/_/foxglove/*$ ) { # Used to automatically connect to robot.  Very risky using IF here
                        rewrite ^(.*)$ $scheme://$http_host/_/foxglove/?ds=rosbridge-websocket&ds.url=ws%3A%2F$http_host%2F_%2Fros permanent;
                }
                proxy_http_version 1.1;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # Header is needed to prevent zipped response so sub_filter can work
                proxy_set_header Accept-Encoding "";

                proxy_pass http://host.docker.internal:5100/;
                proxy_buffering off;
        }

        location /_/files {
                client_max_body_size 1024m;
                proxy_http_version 1.1;
                proxy_set_header Upgrade         $http_upgrade;
                proxy_set_header Connection      "Upgrade";
                proxy_set_header Host            $http_host;
                proxy_set_header X-Real-IP       $remote_addr;
                proxy_set_header X-Forward-For   $proxy_add_x_forwarded_for;
                proxy_set_header X-Forward-Proto $scheme;
                proxy_pass http://host.docker.internal:5300;
        }

        location /_/xvn {
                proxy_http_version 1.1;
                proxy_cache_bypass $http_upgrade;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'Upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Access-Control-Allow-Origin *;

                proxy_pass http://192.168.131.35/;
        }

        location /ws/ {
                proxy_http_version 1.1;
                proxy_cache_bypass $http_upgrade;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'Upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Access-Control-Allow-Origin *;

                proxy_pass http://192.168.131.35/ws/;
        }
        location /api/ {
                proxy_http_version 1.1;
                proxy_cache_bypass $http_upgrade;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'Upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header Access-Control-Allow-Origin *;

                proxy_pass http://192.168.131.35/api/;
        }

        location /_/code/ {
                proxy_pass http://host.docker.internal:8100/;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header Host $http_host;
                proxy_set_header X-NginX-Proxy true;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_redirect off;
        }

}
