/**:
  amcl:
    ros__parameters:
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2
      base_frame_id: "base_link"
      beam_skip_distance: 0.5
      beam_skip_error_threshold: 0.9
      beam_skip_threshold: 0.3
      do_beamskip: false
      global_frame_id: "map"
      lambda_short: 0.1
      laser_likelihood_max_dist: 2.0
      laser_max_range: 100.0
      laser_min_range: -1.0
      laser_model_type: "likelihood_field"
      max_beams: 60
      max_particles: 2000
      min_particles: 500
      odom_frame_id: "odom"
      pf_err: 0.05
      pf_z: 0.99
      recovery_alpha_fast: 0.0
      recovery_alpha_slow: 0.0
      resample_interval: 1
      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      save_pose_rate: 0.5
      sigma_hit: 0.2
      tf_broadcast: true
      transform_tolerance: 1.0
      update_min_a: 0.2
      update_min_d: 0.25
      z_hit: 0.5
      z_max: 0.05
      z_rand: 0.5
      z_short: 0.05
      scan_topic: husky/sensors/seyond/scan

  map_saver:
    ros__parameters:
      save_map_timeout: 5.0
      free_thresh_default: 0.25
      occupied_thresh_default: 0.65
      map_subscribe_transient_local: True

  ekf_node:
    ros__parameters:
      odom_frame: 'odom'
      base_link_frame: 'base_link'
      world_frame: 'odom'
      publish_tf: True
      two_d_mode: True
      use_sim_time: False
      print_diagnostics: True
      frequency: 50.0
      odom0: '/platform_velocity_controller/odom'
      odom0_config: [True, True, False, False, False, True, True, True, False, False, False, True, False, False, False]
      odom0_differential: False
      odom0_queue_size: 10
      imu0: 'sensors/imu_0/data'
      imu0_config: [False, False, False, False, False, False, False, False, False, False, False, True, True, False, False]
      imu0_differential: False
      imu0_queue_size: 10
      imu0_remove_gravitational_acceleration: True
